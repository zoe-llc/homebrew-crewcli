name: Validate public Tap

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Homebrew with the read-only repository token
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c
        with:
          token: ${{ github.token }}
          brew-gh-api-token: ""

      - name: Check Ruby syntax
        run: find test Formula -name '*.rb' -print0 | xargs -0 -n1 ruby -c

      - name: Run the Formula-only repository contracts
        run: |
          ruby -Itest test/formula_renames_test.rb
          ruby -Itest test/formula_policy_test.rb
          ruby -Itest test/public_repository_policy_test.rb

      - name: Reject committed credentials
        run: |
          ruby -e '
            patterns = [
              /gh[pousr]_[A-Za-z0-9_]{20,}/,
              /github_pat_[A-Za-z0-9_]{20,}/,
              /-----BEGIN [A-Z ]*PRIVATE KEY-----/
            ]
            files = Dir.glob("**/*", File::FNM_DOTMATCH).select { |path| File.file?(path) && !path.start_with?(".git/") }
            offending = files.select { |path| patterns.any? { |pattern| File.binread(path).match?(pattern) } }
            abort("credential-like bytes found in: #{offending.join(", ")}") unless offending.empty?
          '

      - name: Check Formula style and policy
        run: |
          brew style Formula/crewent.rb
          brew audit --formula --strict zoe-llc/crewcli/crewent

  public-tap-smoke:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Set up Homebrew without GitHub credentials
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c
        with:
          token: ""
          brew-gh-api-token: ""

      - name: Verify anonymous exact Tap access
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/zoe-llc/homebrew-crewcli \
            > "$RUNNER_TEMP/public-tap.json"
          jq -e '.id == 1414534332 and .full_name == "zoe-llc/homebrew-crewcli" and .visibility == "public" and .default_branch == "main"' \
            "$RUNNER_TEMP/public-tap.json"
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/zoe-llc/homebrew-crewcli/commits/main \
            > "$RUNNER_TEMP/public-main.json"
          observed_sha="$(jq -r .sha "$RUNNER_TEMP/public-main.json")"
          test "$observed_sha" = "$GITHUB_SHA"
          curl --fail --silent --show-error \
            "https://raw.githubusercontent.com/zoe-llc/homebrew-crewcli/${GITHUB_SHA}/Formula/crewent.rb" \
            > "$RUNNER_TEMP/expected-crewent.rb"
          expected_formula_sha256="$(ruby -rdigest -e 'puts Digest::SHA256.file(ARGV.fetch(0)).hexdigest' "$RUNNER_TEMP/expected-crewent.rb")"

          git config --global --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true
          test -z "$(git config --global --get-all http.https://github.com/.extraheader || true)"
          clone_root="$RUNNER_TEMP/homebrew-crewcli"
          env -u GH_TOKEN -u GITHUB_TOKEN -u HOMEBREW_GITHUB_API_TOKEN GIT_TERMINAL_PROMPT=0 \
            git clone --no-tags -c credential.helper= https://github.com/zoe-llc/homebrew-crewcli.git "$clone_root"
          git -C "$clone_root" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$clone_root" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(ruby -rdigest -e 'puts Digest::SHA256.file(ARGV.fetch(0)).hexdigest' "$clone_root/Formula/crewent.rb")" = "$expected_formula_sha256"

          brew untap zoe-llc/crewcli >/dev/null 2>&1 || true
          env -u GH_TOKEN -u GITHUB_TOKEN -u HOMEBREW_GITHUB_API_TOKEN \
            GIT_TERMINAL_PROMPT=0 brew tap zoe-llc/crewcli
          tap_root="$(brew --repository)/Library/Taps/zoe-llc/homebrew-crewcli"
          test "$(git -C "$tap_root" remote get-url origin)" = "https://github.com/zoe-llc/homebrew-crewcli"
          test "$(git -C "$tap_root" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(ruby -rdigest -e 'puts Digest::SHA256.file(ARGV.fetch(0)).hexdigest' "$tap_root/Formula/crewent.rb")" = "$expected_formula_sha256"

      - name: Remove the anonymous Tap clone
        if: always()
        run: brew untap zoe-llc/crewcli >/dev/null 2>&1 || true

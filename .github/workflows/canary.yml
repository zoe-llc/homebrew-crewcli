name: Verify exact private Homebrew distribution

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact CLI SemVer without a v prefix
        required: true
        type: string
      sourceSha:
        description: Exact source commit from the immutable release
        required: true
        type: string
      authorizationSha:
        description: Exact source authorization commit
        required: true
        type: string
      bottleRunId:
        description: Successful exact bottle workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: cli-distribution-canary-${{ inputs.version }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_FROM_API: "1"

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate exact dispatch coordinates
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.sourceSha }}
          AUTHORIZATION_SHA: ${{ inputs.authorizationSha }}
          BOTTLE_RUN_ID: ${{ inputs.bottleRunId }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$VERSION" != "0.0.0"
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$AUTHORIZATION_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BOTTLE_RUN_ID" =~ ^[1-9][0-9]*$ ]]

      - name: Check out the exact Tap workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Fetch and preflight the exact bottle workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          BOTTLE_RUN_ID: ${{ inputs.bottleRunId }}
        run: |
          set -euo pipefail
          gh api "repos/zoe-llc/homebrew-crewcli/actions/runs/${BOTTLE_RUN_ID}" > "$RUNNER_TEMP/bottle-run.json"
          jq -e --argjson runId "$BOTTLE_RUN_ID" \
            '.id == $runId and .path == ".github/workflows/bottle.yml" and .event == "workflow_dispatch" and .head_branch == "main" and .status == "completed" and .conclusion == "success"' \
            "$RUNNER_TEMP/bottle-run.json"

      - name: Download the exact bottle candidate
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: bottle-candidate
          path: ${{ runner.temp }}/canary-inputs
          github-token: ${{ github.token }}
          repository: zoe-llc/homebrew-crewcli
          run-id: ${{ inputs.bottleRunId }}

      - name: Validate the exact bottle candidate
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.sourceSha }}
          AUTHORIZATION_SHA: ${{ inputs.authorizationSha }}
          BOTTLE_RUN_ID: ${{ inputs.bottleRunId }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/canary-inputs"
          candidate="$root/metadata/candidate.json"
          matrix="$root/metadata/bottle-matrix.json"
          formula="$root/Formula/crewent.rb"
          for path in "$candidate" "$matrix" "$formula"; do
            test -f "$path"
            test ! -L "$path"
          done
          test "$(jq -c 'keys | sort' "$candidate")" = '["artifactSha256","authorizationSha","bottleMatrixSha256","bottleRunAttempt","bottleRunId","candidateFormulaSha256","manifestSha256","schema","sourceFormulaSha256","sourceSha","tapWorkflowSha","version","workflowBranch","workflowEvent","workflowPath"]'
          jq -e \
            --arg version "$VERSION" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg authorizationSha "$AUTHORIZATION_SHA" \
            --arg bottleRunId "$BOTTLE_RUN_ID" \
            '.schema == "crewcli.homebrew-bottle-candidate/v1" and .version == $version and .sourceSha == $sourceSha and .authorizationSha == $authorizationSha and .bottleRunId == $bottleRunId and (.bottleRunAttempt | type == "number" and . > 0) and (.artifactSha256 | test("^[a-f0-9]{64}$")) and (.manifestSha256 | test("^[a-f0-9]{64}$")) and (.sourceFormulaSha256 | test("^[a-f0-9]{64}$")) and (.candidateFormulaSha256 | test("^[a-f0-9]{64}$")) and (.bottleMatrixSha256 | test("^[a-f0-9]{64}$")) and (.tapWorkflowSha | test("^[a-f0-9]{40}$")) and .workflowPath == ".github/workflows/bottle.yml" and .workflowEvent == "workflow_dispatch" and .workflowBranch == "main"' \
            "$candidate"
          jq -e \
            --arg bottleWorkflowSha "$(jq -r .tapWorkflowSha "$candidate")" \
            --argjson bottleRunAttempt "$(jq -r .bottleRunAttempt "$candidate")" \
            --argjson bottleRunId "$BOTTLE_RUN_ID" \
            '.id == $bottleRunId and .head_sha == $bottleWorkflowSha and .run_attempt == $bottleRunAttempt' \
            "$RUNNER_TEMP/bottle-run.json"
          test "$(ruby -rdigest -e 'puts Digest::SHA256.file(ARGV.fetch(0)).hexdigest' "$formula")" = "$(jq -r .candidateFormulaSha256 "$candidate")"
          test "$(ruby -rdigest -e 'puts Digest::SHA256.file(ARGV.fetch(0)).hexdigest' "$matrix")" = "$(jq -r .bottleMatrixSha256 "$candidate")"
          jq -e \
            --arg version "$VERSION" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg authorizationSha "$AUTHORIZATION_SHA" \
            --arg manifestSha256 "$(jq -r .manifestSha256 "$candidate")" \
            --arg sourceFormulaSha256 "$(jq -r .sourceFormulaSha256 "$candidate")" \
            '.schema == "crewcli.homebrew-bottle-matrix/v1" and .version == $version and .sourceSha == $sourceSha and .authorizationSha == $authorizationSha and .manifestSha256 == $manifestSha256 and .formulaSha256 == $sourceFormulaSha256 and ([.bottles[].target] | sort) == ["linux-arm64","linux-x86_64","macos-arm64"] and (.bottles | all(.status == "PASS" and (.bottle.sha256 | test("^[a-f0-9]{64}$"))))' \
            "$matrix"

          jq -n \
            --arg version "$VERSION" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg authorizationSha "$AUTHORIZATION_SHA" \
            --arg artifactSha256 "$(jq -r .artifactSha256 "$candidate")" \
            --arg manifestSha256 "$(jq -r .manifestSha256 "$candidate")" \
            --arg formulaSha256 "$(jq -r .candidateFormulaSha256 "$candidate")" \
            --arg bottleMatrixSha256 "$(jq -r .bottleMatrixSha256 "$candidate")" \
            --arg macos "$(jq -r '.bottles[] | select(.target == "macos-arm64") | .bottle.sha256' "$matrix")" \
            --arg linuxX64 "$(jq -r '.bottles[] | select(.target == "linux-x86_64") | .bottle.sha256' "$matrix")" \
            --arg linuxArm64 "$(jq -r '.bottles[] | select(.target == "linux-arm64") | .bottle.sha256' "$matrix")" \
            --arg bottleRunId "$BOTTLE_RUN_ID" \
            --argjson bottleRunAttempt "$(jq -r .bottleRunAttempt "$candidate")" \
            --arg bottleWorkflowSha "$(jq -r .tapWorkflowSha "$candidate")" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflowSha "$GITHUB_SHA" \
            '{schema:"crewcli.homebrew-distribution-canary-expected/v1",version:$version,sourceSha:$sourceSha,authorizationSha:$authorizationSha,artifactSha256:$artifactSha256,manifestSha256:$manifestSha256,formulaSha256:$formulaSha256,bottleMatrixSha256:$bottleMatrixSha256,bottles:{"macos-arm64":$macos,"linux-x86_64":$linuxX64,"linux-arm64":$linuxArm64},bottleRunId:$bottleRunId,bottleRunAttempt:$bottleRunAttempt,bottleWorkflowSha:$bottleWorkflowSha,workflowRepository:"zoe-llc/homebrew-crewcli",workflowRunId:$workflowRunId,workflowRunAttempt:$workflowRunAttempt,workflowSha:$workflowSha}' \
            > "$root/expected.json"
          ruby -rjson -e 'value = JSON.parse(File.read(ARGV.fetch(0))); abort unless value.fetch("schema") == "crewcli.homebrew-distribution-canary-expected/v1"' "$root/expected.json"

      - name: Upload verified distribution inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-inputs
          path: ${{ runner.temp }}/canary-inputs
          if-no-files-found: error
          retention-days: 7

  canary:
    needs: preflight
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out the exact Tap workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified distribution inputs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: canary-inputs
          path: ${{ runner.temp }}/canary-inputs

      - name: Attest the actual operating system and architecture
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          system="$(uname -s)"
          machine="$(uname -m)"
          case "$TARGET" in
            macos-arm64)
              test "$system" = "Darwin"
              test "$machine" = "arm64"
              os=macos
              architecture=arm64
              host=macos
              ;;
            linux-x86_64)
              test "$system" = "Linux"
              test "$machine" = "x86_64"
              ! grep -Fqi microsoft /proc/sys/kernel/osrelease
              os=linux
              architecture=x86_64
              host=linux
              ;;
            linux-arm64)
              test "$system" = "Linux"
              [[ "$machine" = "arm64" || "$machine" = "aarch64" ]]
              ! grep -Fqi microsoft /proc/sys/kernel/osrelease
              os=linux
              architecture=arm64
              host=linux
              ;;
            *)
              echo "unsupported target: $TARGET" >&2
              exit 1
              ;;
          esac
          jq -n --arg os "$os" --arg architecture "$architecture" --arg host "$host" \
            '{os:$os,architecture:$architecture,host:$host,verified:true}' \
            > "$RUNNER_TEMP/platform-attestation.json"

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c
        with:
          token: ${{ github.token }}

      - name: Clone the private Tap with the shared read credential
        env:
          TAP_READ_USER: ${{ secrets.CLI_TAP_READ_USER }}
          TAP_READ_TOKEN: ${{ secrets.CLI_TAP_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TAP_READ_USER"
          test -n "$TAP_READ_TOKEN"
          brew untap zoe-llc/crewcli >/dev/null 2>&1 || true
          tap_root="$(brew --repository)/Library/Taps/zoe-llc/homebrew-crewcli"
          mkdir -p "$(dirname "$tap_root")"
          header="$(printf '%s:%s' "$TAP_READ_USER" "$TAP_READ_TOKEN" | base64 | tr -d '\r\n')"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $header" \
            GIT_TERMINAL_PROMPT=0 \
            git clone --no-tags https://github.com/zoe-llc/homebrew-crewcli.git "$tap_root"
          git -C "$tap_root" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$tap_root" remote get-url origin)" = "https://github.com/zoe-llc/homebrew-crewcli.git"
          cp "$RUNNER_TEMP/canary-inputs/Formula/crewent.rb" "$tap_root/Formula/crewent.rb"
          test "$(ruby -rdigest -e 'puts Digest::SHA256.file(ARGV.fetch(0)).hexdigest' "$tap_root/Formula/crewent.rb")" = "$(jq -r .formulaSha256 "$RUNNER_TEMP/canary-inputs/expected.json")"
          unset TAP_READ_TOKEN header

      - name: Verify the exact private bottle lifecycle
        env:
          GHCR_READ_USER: ${{ secrets.CLI_GHCR_READ_USER }}
          GHCR_READ_TOKEN: ${{ secrets.CLI_GHCR_READ_TOKEN }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test -n "$GHCR_READ_USER"
          test -n "$GHCR_READ_TOKEN"
          registry_auth="$(printf '%s:%s' "$GHCR_READ_USER" "$GHCR_READ_TOKEN" | base64 | tr -d '\r\n')"
          export HOMEBREW_DOCKER_REGISTRY_BASIC_AUTH_TOKEN="$registry_auth"
          brew install --force-bottle zoe-llc/crewcli/crewent
          prefix="$(brew --prefix crewent)"
          test "$("$prefix/bin/crewent" --version)" = "$VERSION"
          "$prefix/bin/crewent" --help | grep -q 'Usage:'
          test "$("$prefix/bin/crewcli" --version)" = "$VERSION"
          brew uninstall crewent
          if brew list --formula crewent; then
            echo "crewent remained installed after uninstall" >&2
            exit 1
          fi
          brew install --force-bottle zoe-llc/crewcli/crewent
          prefix="$(brew --prefix crewent)"
          test "$("$prefix/bin/crewent" --version)" = "$VERSION"
          test "$("$prefix/bin/crewcli" --version)" = "$VERSION"
          brew uninstall crewent
          if brew list --formula crewent; then
            echo "crewent remained installed after clean rollback" >&2
            exit 1
          fi
          unset HOMEBREW_DOCKER_REGISTRY_BASIC_AUTH_TOKEN GHCR_READ_TOKEN registry_auth

          mkdir -p "$RUNNER_TEMP/canary-evidence"
          jq -n \
            --arg target "$TARGET" \
            --argjson platform "$(cat "$RUNNER_TEMP/platform-attestation.json")" \
            '{schema:"crewcli.homebrew-distribution-canary-lifecycle/v1",target:$target,platform:$platform,installation:{tapAuthenticated:true,ghcrAuthenticated:true,bottleOnly:true},commands:{primaryVersionMatched:true,primaryHelpMatched:true,aliasVersionMatched:true},lifecycle:{uninstallPassed:true,reinstallPassed:true,cleanRollbackPassed:true}}' \
            > "$RUNNER_TEMP/canary-evidence/lifecycle.json"

      - name: Close the distribution target evidence
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/canary-output"
          ruby scripts/assert_canary_matrix.rb target \
            --target "$TARGET" \
            --expected "$RUNNER_TEMP/canary-inputs/expected.json" \
            --lifecycle "$RUNNER_TEMP/canary-evidence/lifecycle.json" \
            --output "$RUNNER_TEMP/canary-output/${TARGET}.json"
          jq -e '.schema == "crewcli.homebrew-distribution-canary-evidence/v1" and .status == "PASS"' \
            "$RUNNER_TEMP/canary-output/${TARGET}.json"
          cp "$RUNNER_TEMP/canary-inputs/expected.json" "$RUNNER_TEMP/canary-output/expected.json"

      - name: Upload closed distribution target evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-canary-${{ matrix.target }}
          path: ${{ runner.temp }}/canary-output
          if-no-files-found: error
          retention-days: 7

      - name: Remove the candidate installation
        if: always()
        run: |
          brew uninstall crewent >/dev/null 2>&1 || true
          brew untap zoe-llc/crewcli >/dev/null 2>&1 || true

  aggregate:
    needs: canary
    if: always() && needs.canary.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact Tap workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download all three closed target records
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: distribution-canary-*
          path: ${{ runner.temp }}/canary-targets

      - name: Assert the three-target distribution matrix
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/canary-targets"
          expected="$root/distribution-canary-macos-arm64/expected.json"
          for target in linux-x86_64 linux-arm64; do
            cmp "$expected" "$root/distribution-canary-${target}/expected.json"
          done
          mkdir -p "$RUNNER_TEMP/distribution-canary-evidence/targets"
          ruby scripts/assert_canary_matrix.rb matrix \
            --expected "$expected" \
            --output "$RUNNER_TEMP/distribution-canary-evidence/distribution-canary-matrix.json" \
            "$root/distribution-canary-macos-arm64/macos-arm64.json" \
            "$root/distribution-canary-linux-x86_64/linux-x86_64.json" \
            "$root/distribution-canary-linux-arm64/linux-arm64.json"
          cp "$expected" "$RUNNER_TEMP/distribution-canary-evidence/expected.json"
          cp "$root/distribution-canary-macos-arm64/macos-arm64.json" "$RUNNER_TEMP/distribution-canary-evidence/targets/"
          cp "$root/distribution-canary-linux-x86_64/linux-x86_64.json" "$RUNNER_TEMP/distribution-canary-evidence/targets/"
          cp "$root/distribution-canary-linux-arm64/linux-arm64.json" "$RUNNER_TEMP/distribution-canary-evidence/targets/"

      - name: Upload the blocking distribution canary matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-canary-evidence
          path: ${{ runner.temp }}/distribution-canary-evidence
          if-no-files-found: error
          retention-days: 7

# Manual, read-only import from an exact private zoe-llc/crewent Immutable Release.
# Secrets are synchronized only after source-side App scope verification.

name: Import distribution manifest

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact CLI SemVer (for example 0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact Tap revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Create source read token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.CLI_DISTRIBUTION_READER_APP_ID }}
          private-key: ${{ secrets.CLI_DISTRIBUTION_READER_APP_PRIVATE_KEY }}
          owner: zoe-llc
          repositories: crewent
          permission-contents: read

      - name: Verify the exact App installation
        env:
          ACTUAL_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          ACTUAL_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          EXPECTED_INSTALLATION_ID: ${{ secrets.CLI_DISTRIBUTION_READER_APP_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          test "$ACTUAL_APP_SLUG" = "crewent-distribution-reader"
          test "$ACTUAL_INSTALLATION_ID" = "$EXPECTED_INSTALLATION_ID"

      - name: Download and validate the exact immutable manifest
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || [[ "$VERSION" = "0.0.0" ]]; then
            echo "version must be an exact non-placeholder SemVer" >&2
            exit 1
          fi

          tag="cli-v${VERSION}"
          release_json="$RUNNER_TEMP/source-release.json"
          manifest="$RUNNER_TEMP/distribution-release.json"
          formula="$RUNNER_TEMP/crewent.rb"

          gh api "repos/zoe-llc/crewent/releases/tags/${tag}" >"$release_json"
          asset_url="$(ruby scripts/select_release_asset.rb \
            --config config/distribution.json \
            --release "$release_json" \
            --version "$VERSION")"
          gh api -H "Accept: application/octet-stream" "$asset_url" >"$manifest"

          ruby scripts/import_release.rb render \
            --config config/distribution.json \
            --manifest "$manifest" \
            --output "$formula"
          ruby -c "$formula"
          (cd "$RUNNER_TEMP" && sha256sum distribution-release.json crewent.rb)

          echo "Validated the exact ${tag} manifest and Crewent Formula candidate."

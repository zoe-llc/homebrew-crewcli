name: Build and publish exact bottles

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact CLI SemVer without a v prefix
        required: true
        type: string
      sourceSha:
        description: Exact source commit from the immutable release
        required: true
        type: string
      authorizationSha:
        description: Exact source authorization commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cli-bottles-${{ inputs.version }}
  cancel-in-progress: false

env:
  BOTTLE_ROOT: https://ghcr.io/v2/zoe-llc/crewcli
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_FROM_API: "1"

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ steps.bundle.outputs.artifact-name }}
      artifact-sha256: ${{ steps.bundle.outputs.artifact-sha256 }}
      manifest-sha256: ${{ steps.bundle.outputs.manifest-sha256 }}
      formula-sha256: ${{ steps.bundle.outputs.formula-sha256 }}
    steps:
      - name: Validate exact coordinates
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.sourceSha }}
          AUTHORIZATION_SHA: ${{ inputs.authorizationSha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$VERSION" != "0.0.0"
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$AUTHORIZATION_SHA" =~ ^[a-f0-9]{40}$ ]]

      - name: Check out the exact Tap workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create exact source read token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CLI_DISTRIBUTION_READER_APP_ID }}
          private-key: ${{ secrets.CLI_DISTRIBUTION_READER_APP_PRIVATE_KEY }}
          owner: zoe-llc
          repositories: crewent
          permission-contents: read

      - name: Verify the exact App installation
        env:
          ACTUAL_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          ACTUAL_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          EXPECTED_INSTALLATION_ID: ${{ secrets.CLI_DISTRIBUTION_READER_APP_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          test "$ACTUAL_APP_SLUG" = "crewent-distribution-reader"
          test "$ACTUAL_INSTALLATION_ID" = "$EXPECTED_INSTALLATION_ID"

      - name: Download the complete immutable source release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.sourceSha }}
          AUTHORIZATION_SHA: ${{ inputs.authorizationSha }}
        run: |
          set -euo pipefail
          release_directory="$RUNNER_TEMP/source-release"
          mkdir -p "$release_directory"
          gh api "repos/zoe-llc/crewent/releases/tags/cli-v${VERSION}" > "$release_directory/release.json"
          gh api "repos/zoe-llc/crewent/git/ref/tags/cli-v${VERSION}" > "$release_directory/tag-reference.json"
          tag_sha="$(jq -r '.object.sha' "$release_directory/tag-reference.json")"
          gh api "repos/zoe-llc/crewent/git/tags/${tag_sha}" > "$release_directory/tag-object.json"
          gh api "repos/zoe-llc/crewent/compare/${AUTHORIZATION_SHA}...develop" > "$release_directory/authorization-develop-compare.json"
          gh api "repos/zoe-llc/crewent/compare/${SOURCE_SHA}...${AUTHORIZATION_SHA}" > "$release_directory/source-authorization-compare.json"
          jq -n \
            --arg authorizationSha "$AUTHORIZATION_SHA" \
            --arg authorizationMergeBase "$(jq -r '.merge_base_commit.sha' "$release_directory/authorization-develop-compare.json")" \
            --arg authorizationStatus "$(jq -r '.status' "$release_directory/authorization-develop-compare.json")" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg sourceMergeBase "$(jq -r '.merge_base_commit.sha' "$release_directory/source-authorization-compare.json")" \
            --arg sourceStatus "$(jq -r '.status' "$release_directory/source-authorization-compare.json")" \
            '{authorizationOnDevelop:{baseSha:$authorizationSha,head:"develop",mergeBaseSha:$authorizationMergeBase,status:$authorizationStatus},sourceToAuthorization:{baseSha:$sourceSha,head:$authorizationSha,mergeBaseSha:$sourceMergeBase,status:$sourceStatus}}' \
            > "$release_directory/ancestry.json"
          expected_names=(
            "crewent-cli-${VERSION}.tgz"
            package-artifact.json
            distribution-release.json
            sbom.cdx.json
            redistribution-evidence.json
            release-evidence.json
          )
          for name in "${expected_names[@]}"; do
            asset_url="$(jq -r --arg name "$name" '[.assets[] | select(.name == $name) | .url] | if length == 1 then .[0] else error("asset identity mismatch") end' "$release_directory/release.json")"
            gh api -H "Accept: application/octet-stream" "$asset_url" > "$release_directory/$name"
          done
          activation_path="docs/verification/cli-internal-activation-window-${VERSION}.json"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/zoe-llc/crewent/contents/${activation_path}?ref=${AUTHORIZATION_SHA}" \
            > "$release_directory/activation-window.json"

      - name: Verify release identity, authorization, manifest, and all digests
        id: bundle
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.sourceSha }}
          AUTHORIZATION_SHA: ${{ inputs.authorizationSha }}
        run: |
          set -euo pipefail
          release_directory="$RUNNER_TEMP/source-release"
          ruby scripts/verify_activation_window.rb \
            --evidence "$release_directory/activation-window.json" \
            --ancestry "$release_directory/ancestry.json" \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --authorization-sha "$AUTHORIZATION_SHA" \
            --executor "github:$GITHUB_ACTOR" \
            --output "$release_directory/authorization.json"
          ruby scripts/verify_release_bundle.rb \
            --release "$release_directory/release.json" \
            --tag-reference "$release_directory/tag-reference.json" \
            --tag-object "$release_directory/tag-object.json" \
            --directory "$release_directory" \
            --config config/distribution.json \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --authorization-sha "$AUTHORIZATION_SHA" \
            --output "$release_directory/bundle.json"
          mkdir -p "$release_directory/Formula"
          ruby scripts/import_release.rb render \
            --config config/distribution.json \
            --manifest "$release_directory/distribution-release.json" \
            --output "$release_directory/Formula/crewent.rb"
          artifact_name="$(jq -r .artifactFileName "$release_directory/bundle.json")"
          artifact_sha256="$(jq -r .artifactSha256 "$release_directory/bundle.json")"
          manifest_sha256="$(jq -r .manifestSha256 "$release_directory/bundle.json")"
          formula_sha256="$(ruby -rdigest -e 'puts Digest::SHA256.file(ARGV.fetch(0)).hexdigest' "$release_directory/Formula/crewent.rb")"
          {
            echo "artifact-name=$artifact_name"
            echo "artifact-sha256=$artifact_sha256"
            echo "manifest-sha256=$manifest_sha256"
            echo "formula-sha256=$formula_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload verified release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-inputs
          path: ${{ runner.temp }}/source-release
          if-no-files-found: error
          retention-days: 7

  build:
    needs: preflight
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
            os: macos
            architecture: arm64
            bottle-tag: arm64_sequoia
          - target: linux-x86_64
            runner: ubuntu-24.04
            os: linux
            architecture: x86_64
            bottle-tag: x86_64_linux
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            architecture: arm64
            bottle-tag: arm64_linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out the exact Tap workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified release inputs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-inputs
          path: ${{ runner.temp }}/source-release

      - name: Install the exact candidate Formula
        run: cp "$RUNNER_TEMP/source-release/Formula/crewent.rb" Formula/crewent.rb

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c
        with:
          token: ${{ github.token }}

      - name: Preload the verified tarball into the Homebrew cache
        env:
          ARTIFACT_NAME: ${{ needs.preflight.outputs.artifact-name }}
          ARTIFACT_SHA256: ${{ needs.preflight.outputs.artifact-sha256 }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/source-release/$ARTIFACT_NAME"
          test "$(ruby -rdigest -e 'puts Digest::SHA256.file(ARGV.fetch(0)).hexdigest' "$artifact")" = "$ARTIFACT_SHA256"
          cache_path="$(brew --cache --build-from-source zoe-llc/crewcli/crewent)"
          mkdir -p "$(dirname "$cache_path")"
          cp "$artifact" "$cache_path"

      - name: Build, test, and bottle without registry resolution
        env:
          HOMEBREW_CLI_DISTRIBUTION_BOTTLE_BUILD: "1"
          npm_config_offline: "true"
          npm_config_registry: https://registry.invalid.example
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bottle"
          brew install --build-bottle zoe-llc/crewcli/crewent
          brew test zoe-llc/crewcli/crewent
          prefix="$(brew --prefix crewent)"
          test "$("$prefix/bin/crewent" --version)" = "${{ inputs.version }}"
          "$prefix/bin/crewent" --help | grep -q 'Usage:'
          test "$("$prefix/bin/crewcli" --version)" = "${{ inputs.version }}"
          if grep -R "registry.npmjs.org" "$(brew --cache)/logs/crewent" 2>/dev/null; then
            echo "npm registry access is prohibited during bottle build" >&2
            exit 1
          fi
          cd "$RUNNER_TEMP/bottle"
          brew bottle --json --root-url="$BOTTLE_ROOT" zoe-llc/crewcli/crewent

      - name: Write closed target evidence
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.sourceSha }}
          AUTHORIZATION_SHA: ${{ inputs.authorizationSha }}
          MANIFEST_SHA256: ${{ needs.preflight.outputs.manifest-sha256 }}
          FORMULA_SHA256: ${{ needs.preflight.outputs.formula-sha256 }}
          TARGET: ${{ matrix.target }}
          RUNNER_LABEL: ${{ matrix.runner }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}
          BOTTLE_TAG: ${{ matrix.bottle-tag }}
        run: |
          set -euo pipefail
          bottle_directory="$RUNNER_TEMP/bottle"
          bottle_file="$(find "$bottle_directory" -maxdepth 1 -type f -name '*.bottle.tar.gz' -print)"
          bottle_json="$(find "$bottle_directory" -maxdepth 1 -type f -name '*.bottle.json' -print)"
          test -n "$bottle_file"
          test -n "$bottle_json"
          test "$(printf '%s\n' "$bottle_file" | wc -l | tr -d ' ')" = "1"
          test "$(printf '%s\n' "$bottle_json" | wc -l | tr -d ' ')" = "1"
          BOTTLE_FILE="$bottle_file" ruby -rjson -rdigest <<'RUBY'
          file = ENV.fetch("BOTTLE_FILE")
          digest = Digest::SHA256.file(file).hexdigest
          expected_name = "crewent--#{ENV.fetch("VERSION")}.#{ENV.fetch("BOTTLE_TAG")}.bottle.tar.gz"
          abort "unexpected bottle filename" unless File.basename(file) == expected_name
          evidence = {
            "schema" => "crewcli.homebrew-bottle-evidence/v1",
            "target" => ENV.fetch("TARGET"),
            "status" => "PASS",
            "version" => ENV.fetch("VERSION"),
            "sourceSha" => ENV.fetch("SOURCE_SHA"),
            "authorizationSha" => ENV.fetch("AUTHORIZATION_SHA"),
            "manifestSha256" => ENV.fetch("MANIFEST_SHA256"),
            "formulaSha256" => ENV.fetch("FORMULA_SHA256"),
            "runner" => ENV.fetch("RUNNER_LABEL"),
            "os" => ENV.fetch("TARGET_OS"),
            "architecture" => ENV.fetch("TARGET_ARCHITECTURE"),
            "bottle" => {
              "tag" => ENV.fetch("BOTTLE_TAG"),
              "fileName" => expected_name,
              "sha256" => digest,
              "blobUrl" => "https://ghcr.io/v2/zoe-llc/crewcli/crewent/blobs/sha256:#{digest}"
            }
          }
          File.write(File.join(File.dirname(file), "#{ENV.fetch("TARGET")}.evidence.json"), "#{JSON.generate(evidence)}\n")
          RUBY

      - name: Upload exact target bottle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bottle-${{ matrix.target }}
          path: ${{ runner.temp }}/bottle
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [preflight, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the exact Tap workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified release inputs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-inputs
          path: ${{ runner.temp }}/source-release

      - name: Download all target bottles
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: bottle-*
          path: ${{ runner.temp }}/bottles
          merge-multiple: true

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c
        with:
          token: ${{ github.token }}

      - name: Assert the all-or-nothing matrix and merge candidate metadata
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.sourceSha }}
          AUTHORIZATION_SHA: ${{ inputs.authorizationSha }}
          MANIFEST_SHA256: ${{ needs.preflight.outputs.manifest-sha256 }}
          FORMULA_SHA256: ${{ needs.preflight.outputs.formula-sha256 }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/source-release/Formula/crewent.rb" Formula/crewent.rb
          expected="$RUNNER_TEMP/bottles/expected.json"
          jq -n \
            --arg version "$VERSION" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg authorizationSha "$AUTHORIZATION_SHA" \
            --arg manifestSha256 "$MANIFEST_SHA256" \
            --arg formulaSha256 "$FORMULA_SHA256" \
            '{version:$version,sourceSha:$sourceSha,authorizationSha:$authorizationSha,manifestSha256:$manifestSha256,formulaSha256:$formulaSha256}' > "$expected"
          ruby scripts/assert_bottle_matrix.rb \
            --expected "$expected" \
            --output "$RUNNER_TEMP/bottles/bottle-matrix.json" \
            "$RUNNER_TEMP/bottles/macos-arm64.evidence.json" \
            "$RUNNER_TEMP/bottles/linux-x86_64.evidence.json" \
            "$RUNNER_TEMP/bottles/linux-arm64.evidence.json"
          mapfile -t bottle_json < <(find "$RUNNER_TEMP/bottles" -maxdepth 1 -type f -name '*.bottle.json' -print | sort)
          test "${#bottle_json[@]}" = "3"
          brew bottle --merge --write --no-commit "${bottle_json[@]}"

      - name: Package the immutable local candidate before publication
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.sourceSha }}
          AUTHORIZATION_SHA: ${{ inputs.authorizationSha }}
          ARTIFACT_SHA256: ${{ needs.preflight.outputs.artifact-sha256 }}
          MANIFEST_SHA256: ${{ needs.preflight.outputs.manifest-sha256 }}
          SOURCE_FORMULA_SHA256: ${{ needs.preflight.outputs.formula-sha256 }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/bottle-candidate"
          mkdir -p "$candidate/Formula" "$candidate/docs/verification" "$candidate/metadata"
          cp Formula/crewent.rb "$candidate/Formula/crewent.rb"
          cp "$RUNNER_TEMP/bottles/bottle-matrix.json" "$candidate/metadata/bottle-matrix.json"
          cp "$RUNNER_TEMP/bottles"/*.bottle.json "$candidate/metadata/"
          cp docs/verification/bottle-build-0.1.0.md "$candidate/docs/verification/"
          git diff -- Formula/crewent.rb > "$candidate/Formula/crewent.rb.patch"
          test -s "$candidate/Formula/crewent.rb.patch"
          candidate_formula_sha256="$(ruby -rdigest -e 'puts Digest::SHA256.file(ARGV.fetch(0)).hexdigest' "$candidate/Formula/crewent.rb")"
          bottle_matrix_sha256="$(ruby -rdigest -e 'puts Digest::SHA256.file(ARGV.fetch(0)).hexdigest' "$candidate/metadata/bottle-matrix.json")"
          jq -n \
            --arg version "$VERSION" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg authorizationSha "$AUTHORIZATION_SHA" \
            --arg artifactSha256 "$ARTIFACT_SHA256" \
            --arg manifestSha256 "$MANIFEST_SHA256" \
            --arg sourceFormulaSha256 "$SOURCE_FORMULA_SHA256" \
            --arg candidateFormulaSha256 "$candidate_formula_sha256" \
            --arg bottleMatrixSha256 "$bottle_matrix_sha256" \
            --arg bottleRunId "$GITHUB_RUN_ID" \
            --argjson bottleRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg tapWorkflowSha "$GITHUB_SHA" \
            '{schema:"crewcli.homebrew-bottle-candidate/v1",version:$version,sourceSha:$sourceSha,authorizationSha:$authorizationSha,artifactSha256:$artifactSha256,manifestSha256:$manifestSha256,sourceFormulaSha256:$sourceFormulaSha256,candidateFormulaSha256:$candidateFormulaSha256,bottleMatrixSha256:$bottleMatrixSha256,bottleRunId:$bottleRunId,bottleRunAttempt:$bottleRunAttempt,tapWorkflowSha:$tapWorkflowSha,workflowPath:".github/workflows/bottle.yml",workflowEvent:"workflow_dispatch",workflowBranch:"main"}' \
            > "$candidate/metadata/candidate.json"

      - name: Validate the separate GHCR consumer credential before publication
        env:
          GHCR_READ_USER: ${{ secrets.GHCR_READ_USER }}
          GHCR_READ_PAT: ${{ secrets.GHCR_READ_PAT }}
          GHCR_READ_CREDENTIAL_CONTRACT: classic-pat-read-packages
        run: |
          set -euo pipefail
          test -n "$GHCR_READ_USER"
          test -n "$GHCR_READ_PAT"
          test "$GHCR_READ_CREDENTIAL_CONTRACT" = "classic-pat-read-packages"
          brew install oras
          credential_root="$RUNNER_TEMP/ghcr-consumer-preflight"
          mkdir -p "$credential_root"
          curl --fail --silent --show-error \
            --dump-header "$credential_root/headers.txt" \
            --output "$credential_root/user.json" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GHCR_READ_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user
          test "$(jq -r '.login' "$credential_root/user.json")" = "$GHCR_READ_USER"
          consumer_scopes="$(awk -F ': ' 'tolower($1) == "x-oauth-scopes" { value=tolower($2); gsub(/\r/, "", value); print value }' "$credential_root/headers.txt")"
          test "$consumer_scopes" = "read:packages"
          rm "$credential_root/headers.txt" "$credential_root/user.json"

      - name: Revalidate the exact activation window immediately before publication
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.sourceSha }}
          AUTHORIZATION_SHA: ${{ inputs.authorizationSha }}
        run: |
          set -euo pipefail
          ruby scripts/verify_activation_window.rb \
            --evidence "$RUNNER_TEMP/source-release/activation-window.json" \
            --ancestry "$RUNNER_TEMP/source-release/ancestry.json" \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --authorization-sha "$AUTHORIZATION_SHA" \
            --executor "github:$GITHUB_ACTOR" \
            --output "$RUNNER_TEMP/bottles/publish-authorization.json"

      - name: Publish exact private OCI bottle blobs
        env:
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.actor }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/bottles
        run: |
          set -euo pipefail
          brew pr-upload --upload-only --no-commit --debug --root-url="$BOTTLE_ROOT"

      - name: Collect authenticated private package manifests
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_WRITE_USER: ${{ github.actor }}
          GHCR_WRITE_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package_name="crewcli/crewent"
          oci_repository="ghcr.io/zoe-llc/crewcli/crewent"
          readback_root="$RUNNER_TEMP/ghcr-readback"
          export DOCKER_CONFIG="$RUNNER_TEMP/oras-auth"
          mkdir -p "$DOCKER_CONFIG"
          mkdir -p "$readback_root/manifests" "$readback_root/consumer"
          gh api "orgs/zoe-llc/packages/container/crewcli%2Fcrewent" > "$readback_root/package.json"
          gh api graphql \
            -f query='query { organization(login: "zoe-llc") { packages(first: 10, names: ["crewcli/crewent"], packageType: DOCKER) { nodes { name packageType repository { nameWithOwner } } } } }' \
            > "$readback_root/graphql.json"
          jq -e --arg name "$package_name" '.name == $name and .package_type == "container" and .visibility == "private"' "$readback_root/package.json"
          jq -e '.data.organization.packages.nodes | length == 1 and .[0].repository.nameWithOwner == "zoe-llc/homebrew-crewcli"' "$readback_root/graphql.json"

          printf '%s' "$GHCR_WRITE_TOKEN" | oras login ghcr.io --username "$GHCR_WRITE_USER" --password-stdin
          oras repo tags "$oci_repository" --format json > "$readback_root/tags.json"
          jq -e '.tags | length > 0 and all(test("^[A-Za-z0-9][A-Za-z0-9_.-]*$"))' "$readback_root/tags.json"
          jq -e --arg version "$VERSION" '.tags | index($version) != null' "$readback_root/tags.json"
          : > "$readback_root/child-digests.txt"
          jq -r '.tags[]' "$readback_root/tags.json" | while read -r tag; do
            index_file="$readback_root/manifests/tag-$tag.json"
            oras manifest fetch "$oci_repository:$tag" --format json > "$index_file"
            jq -e '.content.manifests | length > 0 and all(.digest | test("^sha256:[a-f0-9]{64}$"))' "$index_file"
            jq -r '.content.manifests[].digest' "$index_file" >> "$readback_root/child-digests.txt"
          done
          sort -u "$readback_root/child-digests.txt" | while read -r digest; do
            oras manifest fetch "$oci_repository@$digest" --format json > "$readback_root/manifests/${digest#sha256:}.json"
          done
          oras logout ghcr.io
          unset GHCR_WRITE_USER GHCR_WRITE_TOKEN
          if test -f "$DOCKER_CONFIG/config.json"; then
            jq -e '[(.auths // {}) | keys[] | select(test("ghcr\\.io"))] | length == 0' "$DOCKER_CONFIG/config.json"
          fi

      - name: Reject anonymous exact GHCR manifest reads
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          oci_repository="ghcr.io/zoe-llc/crewcli/crewent"
          readback_root="$RUNNER_TEMP/ghcr-readback"
          export DOCKER_CONFIG="$RUNNER_TEMP/oras-auth"
          if test -f "$DOCKER_CONFIG/config.json"; then
            jq -e '[(.auths // {}) | keys[] | select(test("ghcr\\.io"))] | length == 0' "$DOCKER_CONFIG/config.json"
          fi
          tag_reference="$oci_repository:$VERSION"
          version_digest="$(jq -r '.digest' "$readback_root/manifests/tag-$VERSION.json")"
          [[ "$version_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          digest_reference="$oci_repository@$version_digest"
          if oras manifest fetch "$tag_reference" --format json > /dev/null 2>&1; then
            echo "anonymous exact GHCR manifest read succeeded for version tag" >&2
            exit 1
          fi
          if oras manifest fetch "$digest_reference" --format json > /dev/null 2>&1; then
            echo "anonymous exact GHCR manifest read succeeded for digest" >&2
            exit 1
          fi
          jq -n \
            --arg repository "$oci_repository" \
            --arg version "$VERSION" \
            --arg tagReference "$tag_reference" \
            --arg digestReference "$digest_reference" \
            '{schema:"crewcli.ghcr-anonymous-pull/v1",repository:$repository,version:$version,tagReference:$tagReference,digestReference:$digestReference,result:"REJECTED"}' \
            > "$readback_root/anonymous-pull.json"

      - name: Read back exact bottle blobs with a separate consumer
        env:
          GHCR_READ_USER: ${{ secrets.GHCR_READ_USER }}
          GHCR_READ_PAT: ${{ secrets.GHCR_READ_PAT }}
        run: |
          set -euo pipefail
          oci_repository="ghcr.io/zoe-llc/crewcli/crewent"
          readback_root="$RUNNER_TEMP/ghcr-readback"
          export DOCKER_CONFIG="$RUNNER_TEMP/oras-auth"
          printf '%s' "$GHCR_READ_PAT" | oras login ghcr.io --username "$GHCR_READ_USER" --password-stdin
          jq -r '.bottles[].bottle.sha256' "$RUNNER_TEMP/bottles/bottle-matrix.json" | while read -r digest; do
            destination="$readback_root/consumer/${digest}.tar.gz"
            oras blob fetch --output "$destination" "$oci_repository@sha256:${digest}"
          done
          oras logout ghcr.io
          ruby scripts/assert_ghcr_readback.rb \
            --package "$readback_root/package.json" \
            --graphql "$readback_root/graphql.json" \
            --tags "$readback_root/tags.json" \
            --manifests "$readback_root/manifests" \
            --matrix "$RUNNER_TEMP/bottles/bottle-matrix.json" \
            --readbacks "$readback_root/consumer" \
            --consumer-user "$GHCR_READ_USER" \
            --anonymous-pull "$readback_root/anonymous-pull.json" \
            --output "$RUNNER_TEMP/bottle-candidate/metadata/ghcr-readback.json"
          unset GHCR_READ_USER GHCR_READ_PAT

      - name: Upload bottle candidate for exact review and canary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bottle-candidate
          path: ${{ runner.temp }}/bottle-candidate
          if-no-files-found: error
          retention-days: 7
